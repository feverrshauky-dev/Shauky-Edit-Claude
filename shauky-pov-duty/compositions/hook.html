  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Window is 132 tall with a 6 px border: centre a 120 px row inside.
    tl.set("#hook-strip", { y: 0 }, 0);
    // frame 0 already reads "SALES ADVISOR"; it settles in place

    // the stamp slams on the landing
