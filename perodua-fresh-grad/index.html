<!DOCTYPE html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      :root {
        --ground: #0e1116;
        --panel: #171c24;
        --panel-2: #222a35;
        --ink: #ffffff;
        --mute: #b4bdca;
        --lime: #c8ec3c;
        --red: #ff4d4d;
        --amber: #ffb43c;
        --font-display: "Montserrat", "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
        color: var(--ink);
        background: radial-gradient(120% 70% at 50% 18%, #1c2533 0%, var(--ground) 62%);
      }
      #grid {
        position: absolute;
        left: -80px;
        top: -80px;
        width: 1240px;
        height: 2080px;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 2px, transparent 2px);
        background-size: 48px 48px;
      }
      #prog {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 120px;
        display: flex;
        gap: 12px;
        opacity: 0;
        z-index: 30;
      }
      .pg {
        flex: 1;
        height: 12px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .pg i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--lime);
      }

      /* Shared by every scene */
      .step {
        position: absolute;
        left: 0;
        width: 100%;
        top: 184px;
        text-align: center;
      }
      .step span {
        display: inline-block;
        padding: 12px 28px 14px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--ground);
        font-weight: 800;
        font-size: 36px;
        line-height: 1;
        letter-spacing: 0.06em;
      }
      .title {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 262px;
        text-align: center;
        font-weight: 800;
        font-size: 86px;
        line-height: 1.02;
      }
      .title b {
        color: var(--lime);
      }
      .note {
        position: absolute;
        left: 90px;
        right: 90px;
        text-align: center;
        color: var(--mute);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.3;
      }
      .card {
        position: absolute;
        left: 70px;
        right: 70px;
        border-radius: 36px;
        background: var(--panel);
        border: 2px solid rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="56" data-width="1080" data-height="1920">
      <div id="grid"></div>
      <div id="prog">
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
      </div>

      <!-- One scene per beat: hook, six steps, call to action -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="bajet" data-composition-id="bajet" data-composition-src="compositions/bajet.html" data-start="5" data-duration="8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="model" data-composition-id="model" data-composition-src="compositions/model.html" data-start="13" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="dokumen" data-composition-id="dokumen" data-composition-src="compositions/dokumen.html" data-start="22" data-duration="8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="kredit" data-composition-id="kredit" data-composition-src="compositions/kredit.html" data-start="30" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="kos" data-composition-id="kos" data-composition-src="compositions/kos.html" data-start="36" data-duration="8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="proses" data-composition-id="proses" data-composition-src="compositions/proses.html" data-start="44" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="51" data-duration="5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>

      <!-- Sound effects -->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.05" data-duration="1.6" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-car-in" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.8" data-duration="0.6" data-track-index="6" data-volume="0.55"></audio>
      <audio id="sfx-warn" class="clip" src="assets/sfx/pop.mp3" data-start="2.45" data-duration="0.5" data-track-index="7" data-volume="0.85"></audio>
      <audio id="sfx-cut-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.9" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-bar" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.6" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-rule" class="clip" src="assets/sfx/pop.mp3" data-start="9.3" data-duration="0.5" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-cut-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="12.9" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-m1" class="clip" src="assets/sfx/pop.mp3" data-start="13.9" data-duration="0.5" data-track-index="6" data-volume="0.7"></audio>
      <audio id="sfx-m2" class="clip" src="assets/sfx/pop.mp3" data-start="14.7" data-duration="0.5" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-m3" class="clip" src="assets/sfx/pop.mp3" data-start="15.5" data-duration="0.5" data-track-index="6" data-volume="0.7"></audio>
      <audio id="sfx-fit" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.5" data-duration="0.3" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-cut-4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="21.9" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-d1" class="clip" src="assets/sfx/click-soft.mp3" data-start="23.2" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-d2" class="clip" src="assets/sfx/click-soft.mp3" data-start="23.7" data-duration="0.3" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-d3" class="clip" src="assets/sfx/click-soft.mp3" data-start="24.2" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-d4" class="clip" src="assets/sfx/click-soft.mp3" data-start="24.7" data-duration="0.3" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-d5" class="clip" src="assets/sfx/click-soft.mp3" data-start="25.2" data-duration="0.3" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-tip" class="clip" src="assets/sfx/pop.mp3" data-start="25.5" data-duration="0.5" data-track-index="7" data-volume="0.75"></audio>
      <audio id="sfx-cut-5" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="29.9" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-warn2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="32.5" data-duration="1.2" data-track-index="6" data-volume="0.28"></audio>
      <audio id="sfx-cut-6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="35.9" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="38.2" data-duration="2.6" data-track-index="7" data-volume="0.2" data-fade-in="0.5"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="41.25" data-duration="1.4" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-cut-7" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="43.9" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-p1" class="clip" src="assets/sfx/pop.mp3" data-start="45" data-duration="0.5" data-track-index="6" data-volume="0.7"></audio>
      <audio id="sfx-p2" class="clip" src="assets/sfx/pop.mp3" data-start="45.9" data-duration="0.5" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-p3" class="clip" src="assets/sfx/pop.mp3" data-start="46.8" data-duration="0.5" data-track-index="6" data-volume="0.7"></audio>
      <audio id="sfx-p4" class="clip" src="assets/sfx/pop.mp3" data-start="47.7" data-duration="0.5" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-cut-8" class="clip" src="assets/sfx/whoosh.mp3" data-start="50.85" data-duration="0.6" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/sparkle.mp3" data-start="52.7" data-duration="1.8" data-track-index="6" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Background dots drift slowly for the whole film.
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -48, y: -96, duration: 56, ease: "none" }, 0);

      // Progress bar: one segment per step, filling across that step's scene.
      tl.fromTo("#prog", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5);
      [[5, 8], [13, 9], [22, 8], [30, 6], [36, 8], [44, 7]].forEach(([start, dur], i) => {
        tl.fromTo(`#prog .pg:nth-child(${i + 1}) i`, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: dur, ease: "none" }, start);
      });
      tl.to("#prog", { opacity: 0, duration: 0.3 }, 50.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
