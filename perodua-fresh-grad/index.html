<!DOCTYPE html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      :root {
        --ground: #0e1116;
        --panel: #171c24;
        --panel-2: #222a35;
        --ink: #ffffff;
        --mute: #b4bdca;
        --lime: #c8ec3c;
        --red: #ff4d4d;
        --amber: #ffb43c;
        --font-display: "Montserrat", "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
        color: var(--ink);
        background: radial-gradient(120% 70% at 50% 18%, #1c2533 0%, var(--ground) 62%);
      }
      #grid {
        position: absolute;
        left: -80px;
        top: -80px;
        width: 1240px;
        height: 2080px;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 2px, transparent 2px);
        background-size: 48px 48px;
      }
      #prog {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 120px;
        display: flex;
        gap: 12px;
        opacity: 0;
        z-index: 30;
      }
      .pg {
        flex: 1;
        height: 12px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .pg i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--lime);
      }

      /* Shared by every scene */
      .step {
        position: absolute;
        left: 0;
        width: 100%;
        top: 184px;
        text-align: center;
      }
      .step span {
        display: inline-block;
        padding: 12px 28px 14px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--ground);
        font-weight: 800;
        font-size: 36px;
        line-height: 1;
        letter-spacing: 0.06em;
      }
      .title {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 262px;
        text-align: center;
        font-weight: 800;
        font-size: 86px;
        line-height: 1.02;
      }
      .title b {
        color: var(--lime);
      }
      .note {
        position: absolute;
        left: 90px;
        right: 90px;
        text-align: center;
        color: var(--mute);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.3;
      }
      .card {
        position: absolute;
        left: 70px;
        right: 70px;
        border-radius: 36px;
        background: var(--panel);
        border: 2px solid rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="89.5" data-width="1080" data-height="1920">
      <div id="grid"></div>
      <div id="prog">
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>
        <div class="pg"><i></i></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Background dots drift slowly for the whole film.
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -48, y: -96, duration: 89.5, ease: "none" }, 0);

      // Progress bar: one segment per step, filling across that step's scene.
      tl.fromTo("#prog", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.5);
      [[6.5, 14.1], [20.6, 12.9], [33.5, 13.95], [47.45, 9.55], [57, 13.9], [70.9, 10.1]].forEach(([start, dur], i) => {
        tl.fromTo(`#prog .pg:nth-child(${i + 1}) i`, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: dur, ease: "none" }, start);
      });
      tl.to("#prog", { opacity: 0, duration: 0.3 }, 80.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
