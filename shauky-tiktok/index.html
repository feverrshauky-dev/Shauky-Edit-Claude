    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera. Jump cuts inside a take alternate scale so each reads as a cut, and the
      // words that matter get a bigger frame. Each take zooms about a point that keeps the
      // chin clear of its caption band. [time, scale, transformOrigin]
      const CAM = [
        [0, 1.0, "50% 57%"], //  take 1: face sits low, title above it
        [2.0333, 1.05],
        [2.8, 1.1], //           "loan kau boleh approve"
        [3.8333, 1.0],
        [6.0, 1.0, "50% 48%"], // take 2
        [9.5667, 1.07],
        [11.2667, 1.0],
        [13.0333, 1.07],
        [15.4, 1.0],
        [19.0, 1.07], //         "tapi apa-apa pun"
        [20.0667, 1.15], //      "keputusan akhir"
        [21.1, 1.22], //         "terletak daripada tangan bank"
        [23.1666, 1.0, "50% 63%"], // take 3: close, chin near the captions
        [27.3999, 1.06],
        [29.2666, 1.0],
        [31.8333, 1.04],
        [35.7333, 1.0, "50% 62%"], // take 4: room above the head stays clear for the CTA
      ];
      CAM.forEach(([t, s, origin]) => {
        const v = { scale: s };
        if (origin) v.transformOrigin = origin;
        tl.set("#cam", v, t);
      });
      // the open and each take change settle in from slightly large
      [[0, 1.06, 0.55], [6.0, 1.08, 0.42], [23.1666, 1.07, 0.4], [35.7333, 1.07, 0.4]].forEach(([t, from, d]) => {
        tl.fromTo("#cam", { scale: from }, { scale: 1.0, duration: d, ease: "expo.out", immediateRender: false }, t);
      });
      // quick punches on the word inside a phrase
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.08, duration: 0.14, ease: "expo.out", immediateRender: false }, 5.46); //   "kena hati-hati"
      tl.fromTo("#cam", { scale: 1.22 }, { scale: 1.28, duration: 0.14, ease: "expo.out", immediateRender: false }, 22.71); // "bank"
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.1, duration: 0.14, ease: "expo.out", immediateRender: false }, 31.29); //   "sebab apa?"

      // The one flash: hook -> explanation. Exposure peaks on the cut and falls back to the grade.
      tl.fromTo("#aroll", { "--hf-color-grading-exposure": -0.04 }, { "--hf-color-grading-exposure": 0.8, duration: 0.16, ease: "power3.in", immediateRender: false }, 5.84);
      tl.to("#aroll", { "--hf-color-grading-exposure": -0.04, duration: 0.26, ease: "power2.out" }, 6.0);

      window.__timelines["main"] = tl;
