    <script>
      window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

      // Camera: hard punch-ins on the jump cuts so they read as intended,
      // bigger on the words that matter. [time, scale, transformOrigin]
      const CAM = [
        [0, 1.0, "50% 74%"], // take 1 frames the face low: zoom about the face, gently
        [2.03, 1.05],
        [2.8, 1.12], //   "loan kau boleh approve"
        [3.83, 1.04],
        [5.86, 1.0, "50% 34%"], // take 2
        [9.43, 1.1],
        [11.13, 1.0],
        [12.9, 1.1],
        [15.27, 1.0],
        [18.87, 1.1],
        [19.93, 1.18], // "keputusan akhir"
        [20.97, 1.28], // "terletak di tangan bank"
        [23.03, 1.0, "50% 30%"], // take 3
        [27.27, 1.1],
        [29.13, 1.0],
        [31.7, 1.08],
        [35.6, 1.0, "50% 36%"], // take 4
        [40.8, 1.12], // "nombor aku dekat bio"
      ];
      CAM.forEach(([t, s, origin]) => {
        const v = { scale: s };
        if (origin) v.transformOrigin = origin;
        tl.set("#cam", v, t);
      });
      // quick emphasis punches inside a phrase
      tl.fromTo("#cam", { scale: 1.04 }, { scale: 1.14, duration: 0.14, ease: "expo.out", immediateRender: false }, 5.29); //  "hati-hati"
      tl.fromTo("#cam", { scale: 1.28 }, { scale: 1.36, duration: 0.14, ease: "expo.out", immediateRender: false }, 22.82); // "bank"
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.2, duration: 0.14, ease: "expo.out", immediateRender: false }, 31.19); //  "sebab apa?"
      tl.fromTo("#cam", { scale: 1.08 }, { scale: 1.18, duration: 0.14, ease: "expo.out", immediateRender: false }, 32.62); // "harapan palsu"

      // Take changes: a short white flash and the new take settling in from slightly large.
      [5.86, 23.03, 35.6].forEach((t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05, ease: "power4.in", immediateRender: false }, t - 0.05);
        tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power3.out" }, t);
        tl.fromTo("#cam", { scale: 1.09 }, { scale: 1.0, duration: 0.4, ease: "expo.out", immediateRender: false }, t);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
