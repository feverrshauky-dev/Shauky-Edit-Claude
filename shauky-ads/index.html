    <style>
      /* Sticker look: sun yellow, hot red and ink on paper, Archivo Black */
      :root {

        --hot: #ff3b30;
        --paper: #fff8e7;
        --go: #25d366;
        --font-display: "Archivo Black", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }
      #cam { position: absolute; inset: 0; z-index: 1; }
      #aroll { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>

        <video id="aroll" class="clip" src="assets/aroll.mp4" data-start="0" data-duration="23.9" data-track-index="0" data-has-audio="true" data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0.03,&quot;contrast&quot;:0.12,&quot;highlights&quot;:-0.14,&quot;shadows&quot;:0.06,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0.04,&quot;tint&quot;:0,&quot;vibrance&quot;:0.18,&quot;saturation&quot;:0.02},&quot;details&quot;:{&quot;vignette&quot;:0.0,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.41176470588235       <!-- Motion graphics: one scene per beat, all kept off the face (y 550-920) -->

      <div id="lima" data-composition-id="lima" data-composition-src="compositions/lima.html" data-start="12.63" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="rebate" data-composition-id="rebate" data-composition-src="compositions/rebate.html" data-start="17.5" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="19.83" data-duration="4.07" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>

      <!-- Warm light leak over the payoff (registry: organic-light-leak-overlay) -->
      <div id="leak" data-composition-id="organic-light-leak-overlay" data-composition-src="compositions/organic-light-leak-overlay.html" data-start="18.62" data-duration="1.9" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 15"></div>

      <!-- Stripe wipes on the two location changes, flash on the payoff -->
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="23.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 30"></div>

      <!-- Karaoke captions (scripts/build_captions.py) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="23.9" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 20"></div>

      <!-- Music bed: "The Corporate Upbeat" by Soundrider/Dope, CC BY 3.0. Ducked under the voice,

      <audio id="music" class="clip" src="assets/music/corporate-upbeat.mp3" data-start="0" data-duration="23.9" data-media-start="12.675" data-track-index="10" data-volume="1" data-fade-out="0.6" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.11},{&quot;t&quot;:18.3,&quot;v&quot;:0.11},{&quot;t&quot;:18.55,&quot;v&quot;:0.0},{&quot;t&quot;:18.7,&quot;v&quot;:0.0},{&quot;t&quot;:18.74,&quot;v&quot;:0.13},{&quot;t&quot;:23.1,&quot;v&quot;:0.13},{&quot;t&quot;:23.4,&quot;v&quot;:0.3}]}]}" data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;highpass&quot;,&quot;id&quot;:&quot;m1&quot;,&quot;label&quot;:&quot;Clear the low end&quot;,&quot;params&quot;:{&quot;frequency&quot;:70}},{&quot;type&quot;:&quot;peaking&quot;,&quot;id&quot;:&quot;m2&quot;,&quot;label&quot;:&quot;Room for the voice&quot;,&quot;params&quot;:{&quot;frequency&quot;:2500,&quot;gain&quot;:-4,&quot;q&quot;:0.8}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;m3&quot;,&quot;params&quot;:{&quot;limit&quot;:-1}}]}"></audio>

      <!-- Sound effects: each placed so its peak lands one frame after its picture -->
      <audio id="sfx-hook-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.000" data-duration="1.6" data-track-index="20" data-volume="0.22"></audio>
      <audio id="sfx-hook-tape" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.000" data-duration="0.5" data-track-index="21" data-volume="0.35"></audio>
      <audio id="sfx-hook-out" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.931" data-duration="0.5" data-track-index="21" data-volume="0.32"></audio>
      <audio id="sfx-x-lesen" class="clip" src="assets/sfx/pop.mp3" data-start="2.113" data-duration="0.5" data-track-index="22" data-volume="0.75"></audio>
      <audio id="sfx-x-deposit" class="clip" src="assets/sfx/click.mp3" data-start="2.900" data-duration="0.35" data-track-index="22" data-volume="0.85"></audio>
      <audio id="sfx-x-penjamin" class="clip" src="assets/sfx/pop.mp3" data-start="3.833" data-duration="0.5" data-track-index="22" data-volume="0.8"></audio>
      <audio id="sfx-tiada-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.371" data-duration="0.5" data-track-index="21" data-volume="0.3"></audio>
      <audio id="sfx-chip-ptptn" class="clip" src="assets/sfx/pop.mp3" data-start="6.213" data-duration="0.5" data-track-index="22" data-volume="0.8"></audio>
      <audio id="sfx-chip-ptptn-swish" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.120" data-duration="0.4" data-track-index="21" data-volume="0.22"></audio>
      <audio id="sfx-chip-baru" class="clip" src="assets/sfx/click.mp3" data-start="6.540" data-duration="0.35" data-track-index="23" data-volume="0.9"></audio>
      <audio id="sfx-chip-ctos" class="clip" src="assets/sfx/pop.mp3" data-start="7.380" data-duration="0.5" data-track-index="22" data-volume="0.85"></audio>
      <audio id="sfx-wipe-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.741" data-duration="0.5" data-track-index="21" data-volume="0.5"></audio>
      <audio id="sfx-maaf-slam" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="10.490" data-duration="1.4" data-track-index="20" data-volume="0.22"></audio>
      <audio id="sfx-maaf-glitch" class="clip" src="assets/sfx/glitch-3.mp3" data-start="8.743" data-duration="2.3" data-track-index="23" data-volume="0.18" data-media-start="0" data-fade-in="0.3"></audio>
      <audio id="sfx-wipe-2" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.501" data-duration="0.5" data-track-index="21" data-volume="0.5"></audio>
      <audio id="sfx-lima-5" class="clip" src="assets/sfx/ping.mp3" data-start="13.209" data-duration="1.0" data-track-index="25" data-volume="0.55"></audio>
      <audio id="sfx-lima-slots" class="clip" src="assets/sfx/click.mp3" data-start="13.680" data-duration="0.35" data-track-index="23" data-volume="0.6"></audio>
      <audio id="sfx-terawal" class="clip" src="assets/sfx/pop.mp3" data-start="14.193" data-duration="0.5" data-track-index="22" data-volume="0.75"></audio>
      <audio id="sfx-sekarang" class="clip" src="assets/sfx/click.mp3" data-start="15.020" data-duration="0.35" data-track-index="23" data-volume="0.8"></audio>
      <audio id="sfx-baru-tag" class="clip" src="assets/sfx/pop.mp3" data-start="17.613" data-duration="0.5" data-track-index="22" data-volume="0.6"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="15.248" data-duration="3.5" data-track-index="24" data-volume="0.18" data-fade-in="1.2"></audio>
      <audio id="sfx-rebate-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="18.680" data-duration="2.0" data-track-index="20" data-volume="0.3"></audio>
      <audio id="sfx-rebate-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="18.806" data-duration="1.8" data-track-index="26" data-volume="0.3"></audio>
      <audio id="sfx-akal" class="clip" src="assets/sfx/pop.mp3" data-start="19.113" data-duration="0.5" data-track-index="22" data-volume="0.7"></audio>

      <audio id="sfx-l1-glitch" class="clip" src="assets/sfx/glitch-1.mp3" data-start="6.080" data-duration="0.35" data-track-index="27" data-volume="0.16" data-fade-out="0.1"></audio>

      <audio id="sfx-stamp-3" class="clip" src="assets/sfx/click.mp3" data-start="10.840" data-duration="0.35" data-track-index="27" data-volume="0.9"></audio>
      <audio id="sfx-sorry" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.891" data-duration="0.5" data-track-index="21" data-volume="0.3"></audio>
      <audio id="sfx-shine-cta" class="clip" src="assets/sfx/sparkle.mp3" data-start="21.873" data-duration="1.0" data-track-index="28" data-volume="0.12" data-fade-out="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera. The burned-in labels in the footage (6.1-7.9 s, 10.5-12.6 s) are covered by
      // stickers at fixed positions, so #cam stays at scale 1 through those windows.
      const at = (t, v) => tl.set("#cam", v, t);
      at(0, { scale: 1, x: 0, y: 0, transformOrigin: "50% 38%" });
      tl.to("#cam", { scale: 1.06, duration: 2.8, ease: "none" }, 0.01);
      at(2.833, { scale: 1.12, transformOrigin: "30% 36%" }); // jump cut: "tiada deposit"
      tl.to("#cam", { scale: 1.15, duration: 1.7, ease: "none" }, 2.84);
      at(4.567, { scale: 1.1, transformOrigin: "35% 36%" }); // "ataupun abang ada masalah"
      tl.to("#cam", { scale: 1, duration: 1.3, ease: "power2.inOut" }, 4.62);
      // new location: settle in behind the wipe
      tl.fromTo("#cam", { scale: 1.14, transformOrigin: "45% 36%" }, { scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, 7.867);
      at(9.05, { scale: 1.13, transformOrigin: "46% 36%" }); // "tak ada masalah"
      at(10.13, { scale: 1 }); // back to 1 before the old label appears at 10.6
      tl.fromTo("#cam", { scale: 1.12, transformOrigin: "42% 32%" }, { scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, 12.633);
      tl.to("#cam", { scale: 1.07, duration: 4.4, ease: "none" }, 13.3);
      // payoff: punch + shake on "rebate"
      at(18.72, { scale: 1.2, transformOrigin: "44% 36%" });
      [[14, -8], [-12, 6], [9, -4], [-6, 3], [3, -2], [0, 0]].forEach(([x, y], i) =>
        tl.to("#cam", { x, y, duration: 0.045, ease: "none" }, 18.72 + i * 0.045)
      );
      tl.to("#cam", { scale: 1.12, duration: 0.8, ease: "power2.out" }, 18.98);
      at(19.833, { scale: 1.04, transformOrigin: "46% 40%" }); // CTA
      tl.to("#cam", { scale: 1.1, duration: 2.7, ease: "none" }, 19.84);
      at(22.6, { scale: 1.17, transformOrigin: "48% 40%" }); // "peace yo!"
      tl.to("#cam", { scale: 1.12, duration: 1.2, ease: "power2.out" }, 22.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
