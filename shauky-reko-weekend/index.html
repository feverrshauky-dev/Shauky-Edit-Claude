    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera: one selfie take, so every jump cut gets a hard scale change to read as intended.
      // [time, scale] - zoom about the face (origin set in CSS).
      const CAM = [
        [0, 1.0],
        [1.97, 1.08], //  "hujung minggu ni"
        [4.33, 1.0], //   "di Perodua 3S"
        [6.33, 1.1], //   "beberapa program menarik"
        [8.5, 1.0], //    "free inspection"
        [11.3, 1.08], //  "loan face to face"
        [13.27, 1.0],
        [16.83, 1.1], //  "cek kesihatan"
        [19.9, 1.0],
        [22.7, 1.08], //  "VR game"
        [25.8, 1.0], //   "Kajang"
        [26.9, 1.1],
        [29.83, 1.0], //  "kami mengalu-alukan"
        [33.53, 1.08], // CTA
      ];
      CAM.forEach(([t, s]) => tl.set("#cam", { scale: s }, t));
      // quick emphasis punches on the words that sell it
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.07, duration: 0.14, ease: "expo.out", immediateRender: false }, 1.36); //  "penting"
      tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.12, duration: 0.14, ease: "expo.out", immediateRender: false }, 15.56); // "banker panel"
      tl.fromTo("#cam", { scale: 1.1 }, { scale: 1.18, duration: 0.14, ease: "expo.out", immediateRender: false }, 28.26); // "Kajang"
      tl.fromTo("#cam", { scale: 1.08 }, { scale: 1.18, duration: 0.14, ease: "expo.out", immediateRender: false }, 36.94); // "Shauky"

      // Section changes: a short white flash and the frame settling in from slightly large.
      [8.5, 25.8, 33.53].forEach((t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.45, duration: 0.05, ease: "power4.in", immediateRender: false }, t - 0.05);
        tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power3.out" }, t);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
